<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten AI untuk UMKM</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <h1>Study<span>Flow</span></h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#fitur">Fitur</a>
        <a href="#form">Mulai</a>
    </nav>
</header>

<main>

<section class="hero" id="home">
    <div>
        <p>Manajemen Tugas Mahasiswa</p>
        <h2>Atur tugas, <span>selesaikan</span> tepat waktu.</h2>
        <a href="#form">Mulai Sekarang</a>
    </div>

    <img src="study.jpg" alt="Mahasiswa sedang belajar">
</section>

<section id="fitur">
    <h2>Fitur Utama</h2>

    <div class="fitur">
        <article>
            <h3>Catat Tugas</h3>
            <p>Simpan tugas kuliah.</p>
        </article>

        <article>
            <h3>Deadline</h3>
            <p>Pantau batas waktu tugas.</p>
        </article>

        <article>
            <h3>Status</h3>
            <p>Pantau tugas yang selesai.</p>
        </article>
    </div>
</section>

<section id="form">
    <h2>Mulai Menggunakan StudyFlow</h2>

    <form>
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" required>

        <fieldset>
            <legend>Jenis Kelamin</legend>
            <input type="radio" id="pria" name="jk" required>
            <label for="pria">Pria</label>
            <input type="radio" id="wanita" name="jk">
            <label for="wanita">Wanita</label>
        </fieldset>

        <button>Kirim</button>
    </form>
</section>

</main>

<footer>© 2026 StudyFlow</footer>

</body>
</html>
